# Tasks and per-dataset seeds live in datasets.yaml.
seeds: [0, 1, 2, 3, 4]
model: resmlp            # resmlp | ftt
resmlp: {width: 384, depth: 4, dropout: 0.2}
ftt: {d_token: 64, n_layers: 3, n_heads: 8, dropout: 0.1}
train:
  epochs: 80             # early stopping on validation macro-F1 still decides (v1's cap of 40 cut CICIoMT short)
  batch_size: 8192
  lr: 2.0e-3
  weight_decay: 1.0e-4
  warmup_frac: 0.03
  patience: 6
  amp: true
  # Class weights for CE: none | inverse_sqrt | inverse
  class_weight: inverse_sqrt
  # Sampler re-balancing exponent (0 = plain shuffle, 1 = fully balanced).
  balance_power: 0.0
  # Samples per epoch; null = one pass over the training split.
  samples_per_epoch: null
  eval_batch_size: 65536
# Overrides merged into `train`, keyed by raw source (apply to every dataset built from it).
dataset_overrides:
  ciciot_full: {samples_per_epoch: 8000000}   # v3 full data: bounded epochs
  botiot:
    class_weight: none
    balance_power: 0.5
    samples_per_epoch: 8000000
xgboost:
  seeds: [0]
  n_estimators: 2000
  max_depth: 10
  learning_rate: 0.1
  early_stopping_rounds: 50
  max_train_rows: 10000000
# Simple models of similar size to the student ("why not a small tree?").
baselines:
  models: [dtree, logreg]
  max_train_rows: 2000000
  logreg_max_train_rows: 1000000
  dtree_max_depth: 10
  logreg_max_iter: 300

smoke:
  seeds: [0]
  train: {epochs: 3, batch_size: 512, patience: 2, eval_batch_size: 4096}
  dataset_overrides:
    botiot: {samples_per_epoch: 5000}
  xgboost: {n_estimators: 30}
  baselines: {logreg_max_iter: 50}
