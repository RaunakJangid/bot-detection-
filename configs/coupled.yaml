# Detector capacity -> number of controllers needed. Demand is held fixed while the detector changes:
# total demand = rho * k_ref * mu_c(demand_reference_model), i.e. rho is the utilisation the reference
# detector would see with k_ref controllers.
topologies: [Geant2012, Cogentco, syn200]
rho_values: [0.5, 0.7, 0.9]
k_ref: 4
demand_reference_model: teacher
k_max: 20
models: [shield, shield_int8, teacher]
runs: 3
budget: 10000
sla_target: 0.95               # fraction of switches within the SLA ...
require_failover: true         # ... also under the worst single-controller failure, with no overload
# SLA per topology. "relative": slack x the `quantile` of switch-to-controller propagation latency of the
# greedy k-median placement with k_ref controllers (no capacity limit). An absolute limit (placement.yaml
# objective.sla_ms) is unreachable on continent-scale networks for any k, which hides the comparison.
sla: {mode: relative, quantile: 0.95, slack: 1.25}
workers: 16

smoke:
  topologies: [syn20]
  rho_values: [0.5]
  k_max: 6
  runs: 1
  budget: 200
  workers: 2
