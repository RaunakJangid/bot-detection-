seed: 2026
workers: 16
runs: 30                       # independent seeds per (algorithm, topology, k, rho)
budget: 20000                  # objective evaluations per run, same for every metaheuristic
zoo: [Abilene, Geant2012, Cogentco, Kdl]
synthetic: [50, 100, 200, 500]
k_values: [2, 4, 6, 8]
rho_values: [0.3, 0.5, 0.7, 0.9]
# rho is swept only at this k; other k values use rho_default. null = full cross product.
rho_sweep_k: 4
rho_default: 0.5
# hybrid_eho_aco = full memetic hybrid; hybrid_* = component ablations (each removes/replaces one part).
# v3 adds gwo, gwo_sa (GWO + the hybrid's SA intensification), foa, woa, hho, de (placement/swarm.py).
# The ACO redesign (hybrid_aco2, hybrid_aco2_no_ls, aco2) was tried and dropped: worse than the original on
# the tuning graphs and on Kdl, and about 20 h for the full grid (partial runs remain in runs.jsonl).
algorithms: [hybrid_eho_aco, hybrid_no_ants, hybrid_no_ls, hybrid_swap_ls, eho, aco, ga, pso, sa,
             gwo, gwo_sa, foa, woa, hho, de, hybrid_fuzzy, hybrid_linear, random,
             kmedian, kcenter, kmeans, pagerank, ilp_ckm]

controller:
  cores: 4
  eta: 0.5                     # fraction of a core's detection throughput available to the controller
  u_max: 0.95                  # max stable utilisation
  # Single-core flows/s of the detector; overridden by outputs/latency/latency.json when present.
  default_mu_flow: 200000
  capacity_run: ciciot_class34 # entry in latency.json (dataset_task)
  capacity_model: shield       # model within that entry used for mu_flow
demand_sigma: 1.0              # lognormal spread of per-switch demand
objective:
  weights: {avg: 1.0, max: 0.5, inter: 0.1, imbalance: 0.2, fail: 1.0}
  overload_penalty: 10.0
  sla_ms: 20.0
  n_reference: 200             # random placements used to normalise terms
hybrid:
  n_clans: 5
  clan_size: 8
  alpha: 0.5                   # clan update: fraction moved toward matriarch
  beta: 0.3                    # matriarch update: fraction moved toward clan consensus
  ants_per_clan: 1             # worst elephants rebuilt by the separating operator each generation
  separation: ants             # ants (ACO construction) | random (plain EHO restart)
  local_search: sa             # sa (simulated-annealing intensification) | swap (first-improvement 1-swap) | none
  local_search_every: 5        # generations between intensification phases
  local_search_evals: 200      # evaluations per intensification phase
  sa_t0_frac: 0.05             # SA start temperature as a fraction of the incumbent objective
aco:
  n_ants: 20
  a: 1.0
  b: 2.0
  evaporation: 0.1
  mask_quantile: 0.05          # coverage mask radius as a quantile of pairwise latency
ga: {pop: 40, cx_rate: 0.9, mut_rate: 0.2, elite: 2, tournament: 3}
pso: {swarm: 30, w: 0.4, c1: 0.3, c2: 0.3}
sa: {t0_samples: 50, cooling: 0.999}
aco2: {heuristic: marginal, reset_after: 20}   # v3 ACO redesign (on top of aco)
gwo: {pack: 30, explore: 1.0, greedy: true}  # explore scales the a/2 random-slot probability
gwo_sa: {every: 5, evals: 200, t0_frac: 0.05}
foa: {flies: 20, radius: 0.5, p_local: 0.7}  # radius: max neighbour swaps as a fraction of k
woa: {pod: 30, spiral: 0.5}
hho: {hawks: 30, perch: 0.3, dives: 3}
de: {pop: 30, F: 0.5, CR: 0.7, mut: 0.3}
# Fair automatic tuning of every metaheuristic (scripts/07a_tune_placement.py): the same number of
# candidate settings per algorithm, scored on TUNING graphs that are never used for evaluation.
tuning:
  synthetic: [50, 100, 200]
  seed_offset: 1000            # tuning graph syn<n> uses seed offset+n (evaluation graphs use seed n)
  k_values: [4, 6]
  rho: 0.7
  runs: 3
  candidates: 16               # default + 15 random draws from the space below
  space:
    hybrid_eho_aco:
      hybrid.n_clans: [3, 5, 8]
      hybrid.clan_size: [5, 8, 12]
      hybrid.alpha: [0.3, 0.5, 0.7]
      hybrid.beta: [0.1, 0.3, 0.5]
      hybrid.local_search_every: [2, 5, 10]
      hybrid.local_search_evals: [50, 200, 500]
      hybrid.sa_t0_frac: [0.01, 0.05, 0.2]
      aco.evaporation: [0.05, 0.1, 0.2, 0.4]
      aco.b: [1.0, 2.0, 4.0]
    eho:
      hybrid.n_clans: [3, 5, 8]
      hybrid.clan_size: [5, 8, 12]
      hybrid.alpha: [0.3, 0.5, 0.7]
      hybrid.beta: [0.1, 0.3, 0.5]
    aco:
      aco.n_ants: [10, 20, 40]
      aco.a: [0.5, 1.0, 2.0]
      aco.b: [1.0, 2.0, 4.0]
      aco.evaporation: [0.05, 0.1, 0.2, 0.4]
      aco.mask_quantile: [0.0, 0.05, 0.1]
    ga:
      ga.pop: [20, 40, 80]
      ga.cx_rate: [0.6, 0.8, 0.95]
      ga.mut_rate: [0.1, 0.2, 0.4]
      ga.tournament: [2, 3, 5]
    pso:
      pso.swarm: [15, 30, 60]
      pso.w: [0.2, 0.4, 0.6]
      pso.c1: [0.1, 0.3, 0.5]
      pso.c2: [0.1, 0.3, 0.5]
    sa:
      sa.t0_samples: [20, 50, 100]
      sa.cooling: [0.995, 0.998, 0.999, 0.9995]
    gwo:
      gwo.pack: [15, 30, 60]
      gwo.explore: [0.25, 0.5, 1.0, 1.5]
      gwo.greedy: [true, false]
    gwo_sa:
      gwo.pack: [15, 30, 60]
      gwo.explore: [0.25, 0.5, 1.0, 1.5]
      gwo_sa.every: [2, 5, 10]
      gwo_sa.evals: [50, 200, 500]
      gwo_sa.t0_frac: [0.01, 0.05, 0.2]
    foa:
      foa.flies: [10, 20, 40]
      foa.radius: [0.25, 0.5, 1.0]
      foa.p_local: [0.3, 0.5, 0.7, 0.9]
    woa:
      woa.pod: [15, 30, 60]
      woa.spiral: [0.2, 0.5, 0.8]
    hho:
      hho.hawks: [15, 30, 60]
      hho.perch: [0.1, 0.3, 0.5]
      hho.dives: [1, 3, 5]
    de:
      de.pop: [15, 30, 60]
      de.F: [0.3, 0.5, 0.8]
      de.CR: [0.3, 0.7, 0.9]
      de.mut: [0.1, 0.3, 0.6]
    hybrid_aco2:
      hybrid.n_clans: [3, 5, 8]
      hybrid.clan_size: [5, 8, 12]
      hybrid.alpha: [0.3, 0.5, 0.7]
      hybrid.beta: [0.1, 0.3, 0.5]
      hybrid.local_search_every: [2, 5, 10]
      hybrid.local_search_evals: [50, 200, 500]
      hybrid.sa_t0_frac: [0.01, 0.05, 0.2]
      aco.evaporation: [0.05, 0.1, 0.2, 0.4]
      aco.b: [1.0, 2.0, 4.0]
      aco2.reset_after: [0, 10, 30]
    aco2:
      aco.n_ants: [10, 20, 40]
      aco.a: [0.5, 1.0, 2.0]
      aco.b: [1.0, 2.0, 4.0]
      aco.evaporation: [0.05, 0.1, 0.2, 0.4]
      aco2.reset_after: [0, 10, 30]
    hybrid_fuzzy:
      hybrid.n_clans: [3, 5, 8]
      hybrid.clan_size: [5, 8, 12]
      hybrid.alpha: [0.3, 0.5, 0.7]
      hybrid.beta: [0.1, 0.3, 0.5]
      hybrid.local_search_every: [2, 5, 10]
      hybrid.local_search_evals: [50, 200, 500]
      hybrid.sa_t0_frac: [0.01, 0.05, 0.2]
      aco.evaporation: [0.05, 0.1, 0.2, 0.4]
      aco.b: [1.0, 2.0, 4.0]
      hybrid.smooth: [0.3, 0.5, 0.8]
      hybrid.stall_gens: [3, 10, 30]
    hybrid_linear:
      hybrid.n_clans: [3, 5, 8]
      hybrid.clan_size: [5, 8, 12]
      hybrid.alpha: [0.3, 0.5, 0.7]
      hybrid.beta: [0.1, 0.3, 0.5]
      hybrid.local_search_every: [2, 5, 10]
      hybrid.local_search_evals: [50, 200, 500]
      hybrid.sa_t0_frac: [0.01, 0.05, 0.2]
      aco.evaporation: [0.05, 0.1, 0.2, 0.4]
      aco.b: [1.0, 2.0, 4.0]
      hybrid.smooth: [0.3, 0.5, 0.8]
      hybrid.stall_gens: [3, 10, 30]
  # Ablations reuse the tuned full hybrid's settings, so only the switched component differs.
  inherit: {hybrid_no_ants: hybrid_eho_aco, hybrid_no_ls: hybrid_eho_aco, hybrid_swap_ls: hybrid_eho_aco,
           hybrid_aco2_no_ls: hybrid_aco2}
resilience:
  link_fail_fracs: [0.05, 0.10, 0.20]
  node_fail_fracs: [0.05, 0.10, 0.20]
  trials: 10
  max_double: 50
brute_force_limit: 2000000     # exact search when C(n, k) is at most this
exact_limit: 100000000         # v3 (07_placement.py --v3): parallel exhaustive search up to this many subsets
ilp_time_limit: 120

smoke:
  workers: 2
  runs: 2
  budget: 300
  zoo: []
  synthetic: [20]
  k_values: [2, 3]
  rho_values: [0.5]
  rho_sweep_k: null
  resilience: {trials: 2, max_double: 5}
  ilp_time_limit: 10
  tuning: {synthetic: [20], k_values: [2], runs: 1, candidates: 2}
